# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-optee-pkcs11"
BBFILE_PATTERN_meta-optee-pkcs11 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-optee-pkcs11 = "8"
LAYERSERIES_COMPAT_meta-optee-pkcs11 = "scarthgap"

LAYERDEPENDS_meta-optee-pkcs11 = "core"
